runtime:
  language: python
  version: '3.10'
statement: Construct a program that prints out whether variable a is bigger than b.
testcases:
- title: Standard Run
  visible: true
  stdin: []
  stdout: ''
  status: pass
elements:
- type: block
  location:
    snippet: a_is_bigger = a < b
  choices:
  - snippet: a_is_bigger = a < b
    role: solution
    indent: 0
  - snippet: a_is_bigger = a > b
    role: distractor
    indent: 0
  - snippet: a_is_bigger = a <= b
    role: distractor
    indent: 0
  - snippet: a_is_bigger = a >= b
    role: distractor
    indent: 0
- type: block
  location:
    snippet: print(a_is_bigger)
  choices:
  - snippet: print(a_is_bigger)
    role: solution
    indent: 0
