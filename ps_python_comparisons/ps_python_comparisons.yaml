title: Comparisons
description: Construct a program that prints out whether variable a is bigger than b.
authors:
- first: Lassi
  last: Haaranen
  email: lassi.haaranen@aalto.fi
  affiliation: Aalto University
pedagogy:
  activity: parsons-puzzles
  difficulty: novice
  prereq_topics: []
  topics:
  - alice_expert:BooleanEvaluating
  - alice_expert:AssigningValueVariable
  - alice_expert:Printing
  - alice_expert:CallingLibraryFunction
  - parser:Gt
  - parser:Call
