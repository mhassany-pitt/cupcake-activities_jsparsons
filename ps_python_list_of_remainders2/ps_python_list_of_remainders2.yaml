id: pp_ps_python_list_of_remainders2
source: main_en.py
title: Construct a function that returns a list of remainders from the input.
description: Construct a program which calculates the remainder of each element of the first list and the element with the
  same index in the second list. The remainders are stored in a new list. If the number in the second list is 0, the program
  should directly add number 2 to the new list instead of the remainder. Finally, the program should print the new list.
