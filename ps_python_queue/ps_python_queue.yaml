id: pp_ps_python_queue
source: main_en.py
title: Construct a function that uses Queue Structure
description: Construct a function that uses Queue Structure to solve a Josephus problem that removes the kth element in a
  given list and returns the last left element. All Queue's functions are predefined (is_empty(), enqueue() and dequeue()).
  Your function should also return a "The list is empty" message if the given list is empty.
