title: Construir una función que use una estructura de cola (Queue)
description: Construye una funcion que use la estructura de Cola para resolver el problema de Josephus que elimina el k-esimo
  elemento en una lista dada y devuelve el ultimo elemento restante. Todas las funciones de Cola estan predefinidas (is_empty(),
  enqueue() y dequeue()). Tu funcion tambien debe devolver un mensaje "la lista esta vacia" si la lista dada esta vacia.
