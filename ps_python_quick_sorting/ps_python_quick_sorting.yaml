title: Practicing quick sort algorithm
description: 'Construct a function that implements quick sort algorithm. The partition() function has been pre defined and
  displayed below. Consider data is a list, first is the first element''s index and last is the last element''s index def
  partition(data, first, last): pivot_value = data[first] left_mark = first+1 right_mark = last done = False while not done:
  while left_mark = pivot_value: right_mark = right_mark-1 if right_mark'
