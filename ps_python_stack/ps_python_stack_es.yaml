title: Construir un programa que cree una estructura de pila (Stack)
description: Construye un programa que cree dos funciones en una estructura de Pila. La primera es la funcion "apilar" y la
  segunda es la funcion "desapilar". Tu funcion desapilar tambien debe verificar si la pila actual esta vacia. is_empty()
  es una funcion predefinida.
