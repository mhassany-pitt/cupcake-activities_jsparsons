title: Construir un programa que genere combinaciones únicas de 3 dígitos
description: 'Construye un programa que cree e imprima todas las combinaciones de tres digitos de los numeros del 1 al 4 de
  forma que cada numero aparezca como maximo una vez y las combinaciones se impriman de menor a mayor. El programa tambien
  debe imprimir el numero total de combinaciones. Por ejemplo: salida 123, 124, 132 ... total: 24.'
