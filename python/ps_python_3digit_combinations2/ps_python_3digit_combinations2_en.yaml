title: Construct a program that creates unique 3 digit combinations
description: 'Construct a program which creates and prints all three-digit combinations from numbers 1-4 such that each number
  appears at most once and the combinations are listed from the smallest to the greatest. The program must also output the
  total number of the combinations. For example, output 123, 124, 132 ... total: 24.'
