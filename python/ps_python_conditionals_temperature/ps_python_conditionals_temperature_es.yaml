id: pp_ps_python_conditionals_temperature_es
source: main_es.py
title: Practicar sentencias if...elif...else
description: Construye un programa que imprima 'Frio' cuando la temperatura sea de 15 grados centigrados o menos, 'Moderado'
  cuando sea mayor de 15 pero no mayor de 25 grados, y 'Caliente' cuando la temperatura sea mayor de 25 grados.
