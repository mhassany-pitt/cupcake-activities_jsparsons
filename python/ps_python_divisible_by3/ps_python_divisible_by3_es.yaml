title: Construir un programa con múltiples sentencias if-elif
description: Construye un programa que verifique cuales de los enteros en el intervalo del 1 al 50 son divisibles solo por
  2, solo por 5 o por ambos. El programa debe almacenar cada grupo en su propia lista e imprimirlas en este orden.
