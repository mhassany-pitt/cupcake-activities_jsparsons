title: Construir una función que verifique el tamaño de una lista enlazada
description: 'Construye una funcion que calcule el numero de elementos en una lista simplemente enlazada. La implementacion
  de la clase ListaEnlazada se da a continuacion. class Node: def __init__(self, data): self.data = data self.next = None
  class LinkedList: def __init__(self): self.head = None def push(self, new): new_node = Node(new) new_node.next = self.head
  self.head = new_node'
