id: pp_ps_python_linked_list_traversal_es
source: main_es.py
title: Construir una función que recorra una lista enlazada
description: 'Construye una funcion que imprima todos los elementos de una Lista Doblemente Enlazada hacia adelante y luego
  en orden inverso. La implementacion de la clase ListaDoblementeEnlazada se da a continuacion. class Node: def __init__(self,
  data): self.data = data self.next = None self.prev = None class DoublyLinkedList: def __init__(self): self.head = None def
  push(self, new_data): new_node = Node(new_data) new_node.next = self.head if self.head is not None: self.head.prev = new_node
  self.head = new_node'
