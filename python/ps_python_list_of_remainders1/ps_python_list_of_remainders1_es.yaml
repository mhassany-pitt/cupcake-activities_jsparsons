title: Construir una función que devuelva una lista de restos (módulos) del valor de entrada
description: Construye una funcion que calcule el residuo de cada elemento de la primera lista con el elemento del mismo indice
  en la segunda lista. Los residuos se almacenan en una nueva lista. Si el numero en la segunda lista es 0, la funcion debe
  agregar directamente el numero 2 a la nueva lista en lugar del residuo.
