title: Practicar el algoritmo de ordenación rápida (Quick Sort)
description: 'Construye una funcion que implemente el algoritmo de ordenamiento rapido. La funcion de particion() ha sido
  predefinida y se muestra a continuacion. Considera que datos es una lista, primero es el indice del primer elemento y ultimo
  es el indice del ultimo elemento. def partition(data, first, last): pivot_value = data[first] left_mark = first+1 right_mark
  = last done = False while not done: while left_mark = pivot_value: right_mark = right_mark-1 if right_mark'
