title: Practicing searching the index of the min and max elements
description: Construct a program that finds the indexes of both the max and min elements in a list. num_list is a test case
  where you need to find the min and max indexes from. The program then needs to print the index of the minimum and the maximum
  elements. This program does not need to consider duplicate elements.
