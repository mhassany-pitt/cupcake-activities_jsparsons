id: pp_ps_python_search_min_max_index_es
source: main_es.py
title: Practicar la búsqueda del índice de los elementos mínimo y máximo
description: Construye un programa que encuentre los indices tanto del elemento maximo como del minimo en una lista. num_lista
  es el caso de prueba donde se deben encontrar los indices minimo y maximo. El programa debe imprimir el indice del elemento
  minimo y el del elemento maximo. Este programa no necesita considerar elementos duplicados.
