title: Construir una función de recorrido inorder (inorden)
description: Construye una funcion de recorrido inorder que recorra recursivamente un arbol desde el nodo izquierdo, nodo
  raiz y nodo derecho. Almacenamos el arbol recorrido en una lista llamada res=[]. La funcion de recorrido esta dentro de
  la clase del arbol. Considera que la clase del arbol ha sido predefinida.
